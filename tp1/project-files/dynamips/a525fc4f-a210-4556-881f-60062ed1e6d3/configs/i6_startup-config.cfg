!
!
!

!
upgrade fpd auto
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R6
!
boot-start-marker
boot-end-marker
!
logging message-counter syslog
!
no aaa new-model
ip source-route
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
no ip domain lookup
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface Loopback0
 ip address 6.6.6.6 255.255.255.255
!
interface FastEthernet0/0
 ip address 20.0.46.2 255.255.255.252
 duplex half
!
interface FastEthernet1/0
 ip address 20.0.56.2 255.255.255.252
 duplex auto
 speed auto
!
interface FastEthernet1/1
 ip address 30.0.36.2 255.255.255.252
 duplex auto
 speed auto
!
interface FastEthernet2/0
 ip address 192.168.50.1 255.255.255.128
 duplex auto
 speed auto
!
interface FastEthernet2/1
 no ip address
 shutdown
 duplex auto
 speed auto
!
router ospf 10
 log-adjacency-changes
 redistribute bgp 65002 subnets
 network 6.6.6.6 0.0.0.0 area 0
 network 20.0.46.0 0.0.0.3 area 0
 network 20.0.56.0 0.0.0.3 area 0
 network 30.0.36.0 0.0.0.3 area 0
 network 192.168.50.0 0.0.0.127 area 0
!
router bgp 65002
 no synchronization
 bgp log-neighbor-changes
 redistribute connected
 redistribute ospf 10
 neighbor 30.0.36.1 remote-as 65001
 no auto-summary
!
ip forward-protocol nd
no ip http server
no ip http secure-server
!
!
!
no cdp log mismatch duplex
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
gatekeeper
 shutdown
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
end
